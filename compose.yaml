name: gameverse-local
services:
  app:
    image: gameverse-local:latest
    build: .
    init: true
    restart: unless-stopped
    env_file: .env.docker
    environment:
      NODE_ENV: production
      PORT: '5555'
      GAMEVERSE_DATABASE_URL: ''
      GAMEVERSE_DB_PATH: /app/data/gameverse.sqlite
      GAMEVERSE_UPLOAD_DIR: /app/data/avatars
      GAMEVERSE_COOKIE_PREFIX: gameverse-local5555
    ports:
      - '5555:5555'
    volumes:
      - local-data:/app/data
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5555/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    develop:
      watch:
        - path: ./src
          action: rebuild
        - path: ./public
          action: rebuild
        - path: ./migrations
          action: rebuild
        - path: ./package.json
          action: rebuild
        - path: ./package-lock.json
          action: rebuild
        - path: ./Dockerfile
          action: rebuild
        - path: ./vite.config.ts
          action: rebuild
        - path: ./tsconfig.json
          action: rebuild
        - path: ./tsconfig.server.json
          action: rebuild
volumes:
  local-data:
